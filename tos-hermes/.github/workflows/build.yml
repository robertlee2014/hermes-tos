name: Build TOS 7 Deb Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dpkg-dev
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev

      - name: Extract version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Run build script
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: ../com.nousresearch.hermes_*.deb

      - name: Upload sha256 artifact
        uses: actions/upload-artifact@v4
        with:
          name: sha256-checksum
          path: ../com.nousresearch.hermes_*.deb.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ../com.nousresearch.hermes_${{ steps.get_version.outputs.version }}_amd64.deb
            ../com.nousresearch.hermes_${{ steps.get_version.outputs.version }}_amd64.deb.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
